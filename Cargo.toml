[package]
name = "claude-title"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
exclude = ["AGENTS.md", "CLAUDE.md", ".hooks"]
description = "Show Claude Code's status in the terminal tab title."
license = "GPL-3.0-only"
repository = "https://github.com/tylerlaprade/claude-title"
readme = "README.md"
authors = ["Tyler Laprade <tyler@tylerlaprade.com>"]
keywords = ["claude", "terminal", "title", "spinner", "hooks"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
