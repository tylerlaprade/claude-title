name: CI

on:
  pull_request:
  push:

jobs:
  test:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # ShellCheck runs on Linux only: the macOS runners do not have it.
      - if: runner.os == 'Linux'
        name: Install current ShellCheck
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install shellcheck
          echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: curl -fsSL -o "$HOME/.shellcheckrc" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/.shellcheckrc
      - if: runner.os == 'Linux'
        run: shellcheck release.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: curl -fsSL -o "$HOME/.rustfmt.toml" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/.rustfmt.toml
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
